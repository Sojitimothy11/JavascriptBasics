<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>Rock Paper Scissors</title>
</head>
<body>

    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div class="choice">
            <img src="./image/rock.png" id="rock" alt="Rock">
        </div>
        <div class="choice">
            <img src="./image/paper.png" id="paper" alt="Paper">
        </div>
        <div class="choice">
            <img src="./image/scissors.png" id="scissors" alt="Scissors">
        </div>
    </div>

    <div class="score-board">
        <div id="user-score" class="score">
            <span>0</span>
            <p>You</p>
        </div>
        <div id="comp-score" class="score">
            <span>0</span>
            <p>Comp</p>
        </div>
    </div>  

    <div class="msg-container">
        <div id="msg">Play Your Move</div>
    </div>

    <script src="./index.js"></script>
</body>
</html>
